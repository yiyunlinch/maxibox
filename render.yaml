services:
  - type: web
    name: maxibox
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_FOUNDRY_API_KEY
        sync: false
      - key: ANTHROPIC_FOUNDRY_RESOURCE
        sync: false
